<svg viewBox="0 0 1100 680" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0E1A2E"/>
      <stop offset="100%" stop-color="#0A1421"/>
    </linearGradient>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#5C6B85"/>
    </marker>
    <marker id="arrowGold" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#D4A843"/>
    </marker>
  </defs>

  <rect width="1100" height="680" fill="url(#bg)"/>

  <!-- grid texture -->
  <g stroke="#16233B" stroke-width="1">
    <line x1="0" y1="170" x2="1100" y2="170"/>
    <line x1="0" y1="640" x2="1100" y2="640"/>
  </g>

  <!-- Header -->
  <text x="50" y="55" font-family="Georgia, 'Times New Roman', serif" font-size="30" fill="#EDEEF2" font-weight="bold">Agentic Governance Architecture</text>
  <text x="50" y="82" font-size="14" fill="#8792A6" letter-spacing="0.5">ORG-AI-011 · Autonomous Expense &amp; Reimbursement Reviewer</text>
  <text x="50" y="104" font-size="12" fill="#5C6B85" font-family="Courier New, monospace">PROJECT 12 · AGENTIC AI GOVERNANCE CASE STUDY</text>

  <line x1="50" y1="122" x2="1050" y2="122" stroke="#24344F" stroke-width="1"/>

  <!-- Pipeline row -->
  <!-- Intake Agent -->
  <g>
    <rect x="60" y="220" width="230" height="130" rx="6" fill="#16233B" stroke="#2A3F5F" stroke-width="1.5"/>
    <circle cx="90" cy="250" r="5" fill="#6FBF8B"/>
    <text x="105" y="255" font-size="12" fill="#6FBF8B" font-family="Courier New, monospace">SCOPED IDENTITY</text>
    <text x="85" y="288" font-size="18" fill="#EDEEF2" font-weight="bold">Intake Agent</text>
    <text x="85" y="310" font-size="12" fill="#8792A6">Read: claims queue,</text>
    <text x="85" y="326" font-size="12" fill="#8792A6">receipt attachments</text>
    <text x="85" y="342" font-size="11" fill="#5C6B85">No write access</text>
  </g>

  <!-- arrow 1 -->
  <line x1="290" y1="285" x2="358" y2="285" stroke="#5C6B85" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Policy-Compliance Agent -->
  <g>
    <rect x="360" y="220" width="230" height="130" rx="6" fill="#16233B" stroke="#2A3F5F" stroke-width="1.5"/>
    <circle cx="390" cy="250" r="5" fill="#6FBF8B"/>
    <text x="405" y="255" font-size="12" fill="#6FBF8B" font-family="Courier New, monospace">SCOPED IDENTITY</text>
    <text x="385" y="288" font-size="18" fill="#EDEEF2" font-weight="bold">Policy-Compliance</text>
    <text x="385" y="308" font-size="18" fill="#EDEEF2" font-weight="bold">Agent</text>
    <text x="385" y="330" font-size="12" fill="#8792A6">Read/eval: expense policy DB</text>
    <text x="385" y="346" font-size="11" fill="#5C6B85">No payment system access</text>
  </g>

  <!-- arrow 2 to gate -->
  <line x1="590" y1="285" x2="658" y2="285" stroke="#5C6B85" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Threshold Gate -->
  <g>
    <rect x="660" y="205" width="150" height="160" rx="6" fill="#1C1710" stroke="#D4A843" stroke-width="2"/>
    <text x="735" y="235" font-size="12" fill="#D4A843" font-family="Courier New, monospace" text-anchor="middle">HUMAN</text>
    <text x="735" y="250" font-size="12" fill="#D4A843" font-family="Courier New, monospace" text-anchor="middle">CHECKPOINT</text>
    <!-- gate arm -->
    <line x1="690" y1="290" x2="780" y2="270" stroke="#D4A843" stroke-width="5" stroke-linecap="round"/>
    <circle cx="690" cy="290" r="6" fill="#D4A843"/>
    <text x="735" y="325" font-size="11" fill="#B8892F" text-anchor="middle">claim &gt; threshold</text>
    <text x="735" y="340" font-size="11" fill="#B8892F" text-anchor="middle">routes here</text>
    <text x="735" y="356" font-size="10" fill="#6B7280" text-anchor="middle">below threshold: pass-through</text>
  </g>

  <!-- gate pass-through line (bypass, dashed) -->
  <path d="M 660 340 Q 735 380 810 340" fill="none" stroke="#3A4A66" stroke-width="1.5" stroke-dasharray="4,4"/>

  <!-- arrow 3 -->
  <line x1="812" y1="285" x2="878" y2="285" stroke="#5C6B85" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Disbursement Agent -->
  <g>
    <rect x="880" y="220" width="160" height="130" rx="6" fill="#16233B" stroke="#2A3F5F" stroke-width="1.5"/>
    <circle cx="905" cy="250" r="5" fill="#C1543C"/>
    <text x="918" y="255" font-size="11" fill="#C1543C" font-family="Courier New, monospace">WRITE-SCOPED</text>
    <text x="900" y="288" font-size="17" fill="#EDEEF2" font-weight="bold">Disbursement</text>
    <text x="900" y="308" font-size="17" fill="#EDEEF2" font-weight="bold">Agent</text>
    <text x="900" y="332" font-size="11" fill="#8792A6">Write: payment</text>
    <text x="900" y="346" font-size="11" fill="#8792A6">instruction (capped)</text>
  </g>

  <!-- Decision rights legend -->
  <text x="50" y="410" font-family="Georgia, serif" font-size="18" fill="#EDEEF2" font-weight="bold">Decision Rights</text>

  <g>
    <circle cx="65" cy="450" r="7" fill="#C1543C"/>
    <text x="85" y="455" font-size="14" fill="#EDEEF2" font-weight="bold">Direct</text>
    <text x="85" y="474" font-size="12" fill="#8792A6">New system approval · scope expansion</text>
    <text x="85" y="490" font-size="12" fill="#8792A6">→ AI Governance Committee</text>
  </g>

  <g>
    <circle cx="415" cy="450" r="7" fill="#D4A843"/>
    <text x="435" y="455" font-size="14" fill="#EDEEF2" font-weight="bold">Advisory</text>
    <text x="435" y="474" font-size="12" fill="#8792A6">Model/framework choice · prompt changes</text>
    <text x="435" y="490" font-size="12" fill="#8792A6">→ System owner, committee consulted</text>
  </g>

  <g>
    <circle cx="765" cy="450" r="7" fill="#6FBF8B"/>
    <text x="785" y="455" font-size="14" fill="#EDEEF2" font-weight="bold">Delegated</text>
    <text x="785" y="474" font-size="12" fill="#8792A6">Monitoring tuning · credential rotation</text>
    <text x="785" y="490" font-size="12" fill="#8792A6">→ Named system owner</text>
  </g>

  <line x1="50" y1="520" x2="1050" y2="520" stroke="#24344F" stroke-width="1"/>

  <!-- Risk score note -->
  <text x="50" y="555" font-size="13" fill="#8792A6">Autonomy multiplier applied per Risk Classification Addendum:</text>
  <text x="50" y="576" font-size="13" fill="#EDEEF2" font-family="Courier New, monospace">Conditional autonomy (this system) → base risk score × 1.5</text>
  <text x="50" y="596" font-size="13" fill="#EDEEF2" font-family="Courier New, monospace">Full autonomy (no checkpoint)      → base risk score × 2.0, Direct approval required</text>

  <text x="1050" y="660" font-size="11" fill="#5C6B85" text-anchor="end">Karun Mehta · AIGP (AI Governance Professional)</text>
</svg>
